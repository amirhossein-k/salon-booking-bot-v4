services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      CONFIG_PATH: /app/config.json
      DB_PATH: /app/data/salon.sqlite3
    volumes:
      - ./config.json:/app/config.json:ro
      - salon_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  dashboard:
    build: .
    command: ["python", "dashboard.py"]
    restart: unless-stopped
    env_file: .env
    environment:
      CONFIG_PATH: /app/config.json
      DB_PATH: /app/data/salon.sqlite3
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - salon_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  salon_data:
